Conflict & Uncertainty", "Type": "CLEAR", "Difficulty": "D3", "Situation": "차기 연식의 기능 추가 여부를 확답받고 구매하려 한다.", "Customer_1": "다음 연식에는 이 기능 들어가죠?", "Judgement": "공식 발표 여부를 먼저 확인한다. 미발표 사양에 대해서는 예상과 확정을 섞지 않는다.", "Response_1": "관심 있으신 기능이라 다음 연식에 적용되는지 궁금하실 것 같습니다. 현재 공식적으로 안내된 내용부터 확인해드리겠습니다. 아직 발표 전이라면 적용 여부는 확답드리기 어려운 점 양해 부탁드립니다.", "Customer_2": "가능성이 높다는 정도는 말해줄 수 있잖아요.", "Response_2": "구매 시점을 정하시려면 가능성이라도 알고 싶으실 것 같습니다. 다만 예상이 실제와 다르면 선택에 불편을 드릴 수 있어 확률로 안내드리기는 조심스럽습니다. 그 기능이 꼭 필요하신지와 차량 이용 시점을 함께 살펴 선택을 도와드리겠습니다.", "NG": ["아마 들어갈 겁니다."], "Evaluation": ["공식 발표 여부를 확인 대상으로 삼았다.", "확률 표현으로도 적용을 암시하지 않았다.", "기능의 필요성과 차량 이용 시점을 함께 살폈다."], "Tags": ["차기연식", "미발표"], "Source": {"Origin": "ADAPTED_AND_EXPANDED", "Original_ID": ["H05"], "Conversation": "chatgpt-conversation://6abf0bce-45f8-83e8-bf79-3cdd56471348", "Reference_URLs": ["https://www.genesis.com/kr/ko/support/customer-support.html"], "Reference_scope": "공식 확인 경로. 개별 거점 정책이나 대화 예시의 공식 승인 근거는 아님."}, "FactCheck": "FACT_CHECK_REQUIRED", "FactCheck_Detail": "현장 사용 시점에 공식 자료의 발표·적용 여부와 확인 담당자, 후속 안내 시점을 확인할 것."}, {"ID": "H06", "Category": "Information Conflict & Uncertainty", "Type": "CLEAR", "Difficulty": "D2", "Situation": "영상 리뷰와 현장 설명이 달라 질문한다.", "Customer_1": "유튜브 리뷰에서는 다르게 설명하던데요?", "Judgement": "영상 게시일·시승차 시장·연식·트림과 실제 구매 대상을 맞춘다. 리뷰어의 전문성을 공격하지 않는다.", "Response_1": "영상을 보고 꼼꼼히 비교하고 계시는군요. 어떤 부분이 다르게 안내됐는지 함께 살펴봐도 될까요? 영상의 게시일과 차량의 연식·사양을 확인해 현재 차량에 해당하는 내용을 정리해드리겠습니다.", "Customer_2": "유명한 리뷰어인데 그분도 모른다는 건가요?", "Response_2": "참고하신 리뷰의 설명도 함께 확인해보겠습니다. 리뷰어의 판단보다는 영상에 나온 차량과 현재 차량의 조건이 같은지를 살펴보려는 취지입니다. 차이가 확인되면 어떤 부분인지 이해하시기 쉽게 안내드리겠습니다.", "NG": ["유튜버 말은 과장이 많습니다."], "Evaluation": ["영상의 차량 조건과 게시일을 확인했다.", "리뷰어를 폄하하지 않았다.", "현재 차량의 적용 여부로 답을 좁혔다."], "Tags": ["영상리뷰", "출처비교"], "Source": {"Origin": "NEW_H_EXPANSION", "Original_ID": [], "Conversation": "chatgpt-conversation://6abf0bce-45f8-83e8-bf79-3cdd56471348", "Reference_URLs": ["https://www.genesis.com/kr/ko/support/customer-support.html"], "Reference_scope": " return `<div class="meta"><span class="id">${r.ID} / ${e(META.categories[r.ID[0]].ko)}</span><span>${stage+1} / 6 단계</span></div><section class="moment kind-${kind} flash" aria-label="${STAGES[stage]}">${stage===5?'':`<div class="stage-label"><span class="badge">${stage===0?'질문':stage===3?'재질문':[2,4].includes(stage)?'응답':'판단'}</span><span>${stage===2?'큐레이터 · 1차':stage===4?'큐레이터 · 2차':stage===1?'답하기 전에 짚어보기':'고객의 말에 귀 기울여보세요'}</span></div>`}${body}</section><nav class="stepbar" aria-label="학습 단계">${STAGES.map((x,i)=>`<button data-stage="${i}" class="${i<stage?'done':''}" ${i===stage?'aria-current="step"':''}><span class="num">${String(i+1).padStart(2,'0')}</span><span>${x}</span></button>`).join('')}</nav>`}
function empty(message){return `<div class="empty"><h2>선택된 카드가 없습니다.</h2><p>${message}</p><button data-action="reset-filters">전체 카테고리 보기</button></div>`}
function renderLearn(){const list=filtered();if(!list.length)return empty('다른 카테고리를 선택해보세요.');const r=list.find(r=>r.ID===state.learnId)||list[0];state.learnId=r.ID;const stage=Math.min(5,Math.max(0,state.learnStage));state.learnStage=stage;const index=list.indexOf(r);return card(r,stage)+`<div class="actions"><button data-action="learn-back" ${stage===0?'disabled':''}><span class="arrow" aria-hidden="true">←</span> 이전 단계</button><button class="primary" data-action="learn-next">${stage===5?(index===list.length-1?'처음 카드로':'다음 카드'):STAGES[stage+1]+' 보기'} <span class="arrow" aria-hidden="true">→</span></button></div><div class="underbar"><select id="learn-select" aria-label="학습 카드 선택">${list.map((x,i)=>`<option value="${x.ID}" ${x.ID===r.ID?'selected':''}>${i+1} / ${list.length} · ${x.ID} ${e(x.Customer_1)}</option>`).join('')}</select><div class="card-arrows"><button data-action="prev-card" aria-label="이전 카드" ${index===0?'disabled':''}>←</button><button data-action="next-card" aria-label="다음 카드" ${index===list.length-1?'disabled':''}>→</button></div></div>`}
function renderChallenge(){if(!state.round)startRound(state.scope);let round=state.round;if(!round.queue.length)return empty(state.scope==='review'?'현재 필터에 복습할 카드가 없습니다.':'다른 카테고리를 선택해보세요.');if(round.pos>=round.queue.length)return `<div class="round-result"><div class="caps">ROUND COMPLETE</div><h2>한 번 더, 더 선명하게.</h2><p>${round.queue.length}개 카드를 중복 없이 마쳤습니다.</p><div class="stats"><div class="stat"><div class="number">${round.results.clear}</div><span>Clear · 통과</span></div><div class="stat"><div class="number">${round.results.review}</div><span>Review · 복습</span></div><div class="stat"><div class="number">${round.results.unknown}</div><span>모름 · 복습에 포함</span></div></div><div class="actions spaced"><button data-action="new-round" class="primary">새 라운드</button><button data-action="review-round">Review만 연습</button></div>${state.scope==='review'?'<button class="textbutton spaced" data-action="all-round">전체 카드로 전환</button>':''}</div>`;
let r=DATA.find(r=>r.ID===round.queue[round.pos]);return `<div class="round-meta">랜덤 퀴즈 · ${round.pos+1} / ${round.queue.length}${state.scope==='review'?' · 복습 카드':''}</div>${round.unknown?'<div class="notice">Review에 저장했습니다. 응답과 평가를 확인한 뒤 다음 카드로 넘어가세요.</div>':''}${card(r,round.stage,true)}${round.hint?`<div class="hint"><span class="caps">HINT</span><p>${e(r.Judgement)}</p></div>`:''}<div class="actions"><button data-action="challenge-back" ${round.stage===0?'disabled':''}><span class="arrow" aria-hidden="true">←</span> 이전 단계</button><div class="right"><button data-action="hint" aria-expanded="${round.hint}">${round.hint?'힌트 닫기':'힌트'}</button><button data-action="reveal" class="primary" ${round.stage===5?'disabled':''}>${round.stage<5?STAGES[round.stage+1]+' 보기':'공개 완료'} <span class="arrow" aria-hidden="true">→</span></button></div></div><div class="grade"><button id="clear-button" data-action="clear" ${round.stage<5||round.checks.length<3||round.unknown?'disabled':''}>Clear · 통과</button><button data-action="review">${round.unknown?'다음 카드':'Review · 복습'}</button><button data-action="unknown" ${round.unknown?'disabled':''}>I don't know</button></div><p class="small spaced">소리 내어 응답한 뒤 예시와 비교하세요. 평가 기준 3개를 충족했다면 Clear로 기록합니다. 통과 기록은 자기평가입니다.</p><div class="underbar"><span class="small">한 라운드 내 중복 없음</span>${state.scope==='review'?'<button class="textbutton" data-action="all-round">전체 카드</button>':''}<button class="textbutton" data-action="new-round">다시 섞기</button></div>`}
function matchingLibrary(){let q=state.query.trim().toLowerCase();return filtered().filter(r=>[r.ID,r.Customer_1,r.Customer_2,r.Situation,r.Category,...r.Tags].join(' ').toLowerCase().includes(q))}
function libraryRows(){const list=matchingLibrary();return list.length?list.map(r=>`<button class="library-row" data-open="${r.ID}"><div class="line"><span>${r.ID}</span><span>${e(META.categories[r.ID[0]].ko)}</span><span class="status">${progress.records[r.ID]?.status==='clear'?'Clear':progress.records[r.ID]?.status==='review'?'Review':'미도전'}</span></div><h3>${e(r.Customer_1)}</h3><div class="tags">${r.Tags.map(x=>'#'+e(x)).join(' ')}</div></button>`).join(''):'<div class="empty"><p>검색 결과가 없습니다. 다른 단어나 필터를 선택해보세요.</p></div>'}
function renderLibrary(){return `<div class="listhead"><h2>전체 스크립트</h2><span class="small" id="result-count">${matchingLibrary().length}개 카드</span></div><input type="search" id="search" aria-label="질문, ID, 태그 검색" placeholder="질문, ID, 태그로 찾기" value="${e(state.query)}"><div id="library-rows">${libraryRows()}</div>`}
function renderProgress(){let clear=DATA.filter(r=>progress.records[r.ID]?.status==='clear').length,review=DATA.filter(r=>progress.records[r.ID]?.status==='review').length,learned=progress.learned.filter(id=>ids.has(id)).length;return `<div class="progress-head"><div class="caps">MY PRACTICE</div><h2>반복이 만드는 여유.</h2></div><div class="stats"><div class="stat"><div class="number">${clear}<small> / 57</small></div><span>Clear · 현재 통과</span></div><div class="stat"><div class="number">${review}</div><span>Review · 복습 필요</span></div><div class="stat"><div class="number">${progress.attempts||0}</div><span>총 도전 횟수</span></div></div><p class="progress-note">통과율 ${Math.round(clear/57*100)}% · 미도전 ${57-clear-review}개 · 평가 단계 확인 ${learned}개<br>자기평가의 최신 결과를 카드별로 반영합니다. 이 브라우저에 저장됩니다.</p><button class="primary" data-action="review-all" ${review?'':'disabled'}>Review ${review}개 다시 연습</button><div class="spaced">${Object.entries(META.categories).map(([k,c])=>{let n=DATA.filter(r=>r.ID[0]===k&&progress.records[r.ID]?.status==='clear').length;return `<div class="category-progress"><div class="row"><span>${k} · ${c.ko}</span><span>${n} / ${c.count}</span></div><div class="bar" role="progressbar" aria-label="${c.ko} 통과" aria-valuemin="0" aria-valuemax="${c.count}" aria-valuenow="${n}"><span style="width:${n/c.count*100}%"></span></div></div>`}).join('')}</div><details class="storage"><summary>저장과 기록 관리</summary><p>같은 브라우저와 주소에서 기록이 이어집니다. 파일 위치 변경, 브라우저 데이터 삭제, 시크릿 모드에서는 기록이 유지되지 않을 수 있습니다. 계정 간 동기화는 지원하지 않습니다.</p><button data-action="reset-progress">진행률 초기화</button></details>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#viewtitle').textContent={learn:'연습 카드',challenge:'랜덤 퀴즈',library:'전체 스크립트',progress:'나의 진행률'}[state.view];renderCategories();$('#content').innerHTML=state.view==='learn'?renderLearn():state.view==='challenge'?renderChallenge():state.view==='library'?renderLibrary():renderProgress();write()}
function resetFilters(){state.category='';state.type='';state.difficulty='';state.query='';state.scope='all';state.round=null;state.learnStage=0}
function advance(status){let round=state.round,id=round.queue[round.pos];if(round.unknown){round.results.review++;round.results.unknown++}else{updateRecord(id,status);round.results[status]++}round.pos++;round.stage=0;round.hint=false;round.unknown=false;round.checks=[];write();render();window.scrollTo({top:0});notify(status==='clear'?'Clear로 저장했습니다.':'Review로 저장했습니다.')}
$('#content').addEventListener('click',ev=>{const step=ev.target.closest('[data-stage]');if(step){const n=Number(step.dataset.stage);if(state.view==='challenge')state.round.stage=n;else{state.learnStage=n;if(n===5&&!progress.learned.includes(state.learnId))progress.learned.push(state.learnId)}render();return}let open=ev.target.closest('[data-open]');if(open){state.learnId=open.dataset.open;state.learnStage=0;setView('learn');return}let action=ev.target.closest('[data-action]')?.dataset.action;if(!action)return;let round=state.round;switch(action){
case 'reset-filters':resetFilters();break;
case 'prev-card':case 'next-card':{const a=filtered(),i=a.findIndex(r=>r.ID===state.learnId);state.learnId=a[Math.max(0,Math.min(a.length-1,i+(action==='next-card'?1:-1)))].ID;state.learnStage=0;break;}
case 'learn-back':state.learnStage=Math.max(0,state.learnStage-1);break;
case 'learn-next':if(state.learnStage<5){state.learnStage++;if(state.learnStage===5&&!progress.learned.includes(state.learnId))progress.learned.push(state.learnId)}else{let l=filtered();state.learnId=l[(l.findIndex(r=>r.ID===state.learnId)+1)%l.length].ID;state.learnStage=0}break;
case 'challenge-back':round.stage=Math.max(0,round.stage-1);break;
case 'reveal':round.stage=Math.min(5,round.stage+1);break;
case 'hint':round.hint=!round.hint;break;
case 'unknown':if(!round.unknown){updateRecord(round.queue[round.pos],'review');round.unknown=true;round.stage=2;round.hint=false;round.checks=[]}break;
case 'clear':if(round.stage===5&&round.checks.length===3&&!round.unknown)advance('clear');return;
case 'review':advance('review');return;
case 'new-round':startRound(state.scope);break;
case 'all-round':startRound('all');break;
case 'review-round':startRound('review');break;
case 'review-all':resetFilters();state.view='challenge';startRound('review');break;
case 'reset-progress':if(!confirm('이 브라우저의 학습 기록과 진행 중인 라운드를 모두 초기화할까요?'))return;progress={records:{},learned:[],attempts:0};state.round=null;notify('진행률을 초기화했습니다.');break;
}write();render()});
$('#content').addEventListener('change',ev=>{if(ev.target.id==='learn-select'){state.learnId=ev.target.value;state.learnStage=0;write();render()}if(ev.target.matches('[data-check]')){let i=Number(ev.target.dataset.check),checks=state.round.checks;state.round.checks=ev.target.checked?[...new Set([...checks,i])]:checks.filter(x=>x!==i);$('#score').textContent=state.round.checks.length+' / 3';$('#clear-button').disabled=state.round.checks.length!==3||state.round.unknown;write()}});
$('#content').addEventListener('input',ev=>{if(ev.target.id==='search'){state.query=ev.target.value;$('#library-rows').innerHTML=libraryRows();$('#result-count').textContent=matchingLibrary().length+'개 카드';write()}});
const params=new URLSearchParams(location.search);if(params.get('mode')==='quiz'){state.category=META.categories[params.get('category')]?params.get('category'):'';startRound('all');state.view='challenge'}render();
</script></body></html>
